apps:
  - name: lexacube
    repo: "https://github.com/stephen5ng/cubes"
    branch: "master"
    path: /opt/lexacube
    venv: cube_env
    exec: /opt/lexacube/cube_env/bin/python3 /opt/lexacube/runpygame.py --mode classic
    user: root  # Required for rpi-rgb-led-matrix GPIO access
    after: "network.target"
    # Only one member of an exclusive_group may run at a time. The two games
    # drive different LED hardware (matrix here, strip for knockstrip) so they
    # do not contend there, but they share one audio output and one 4GB Pi.
    # default_in_group applies only on a fresh flash where no member is enabled
    # yet -- bootstrap otherwise preserves whichever member is already active.
    exclusive_group: game
    default_in_group: true
    service_address:
      address: 192.168.8.247/24
      interface: auto
    environment:
      - LED_DISPLAY_TYPE=mini
      - LEXACUBE_ADMIN_HOST=0.0.0.0
      - LEXACUBE_ADMIN_PORT=8080
    apt_packages:
      - python3-dev
      - python3-pillow
      - python3-setuptools
      - build-essential
      - cython3
      - mosquitto
      - mosquitto-clients
      - iputils-arping
      - netcat-openbsd
      - openssh-client
      - python3-venv
      - alsa-utils
    dependencies:
      - repo: "https://github.com/hzeller/rpi-rgb-led-matrix"
        path: /opt/rpi-rgb-led-matrix
        install_python_cmd: "pip install scikit-build-core cython && pip install {path}"
      - repo: "https://github.com/stephen5ng/cube-pn5180"
        path: /opt/cube-pn5180
        submodules: true
        secret_file:
          source: /etc/lexacube-firmware-secrets.h
          destination: src/secrets.h
          generate: dietpi_wifi
        install_python_cmd: "pip install platformio"
        # Pre-fetch the ESP32 platform, Xtensa toolchain and lib_deps declared in
        # the firmware's platformio.ini, so a freshly bootstrapped Pi can build
        # firmware offline instead of downloading ~1GB on someone's first
        # `pio run`. Idempotent: already-installed packages are skipped.
        toolchain_cmd: "pio pkg install -d {path}"

  - name: nfc-control
    repo: "https://github.com/stephen5ng/nfc-control"
    path: /opt/nfc-control
    exec: /opt/lexacube/cube_env/bin/python3 /opt/nfc-control/nfc_control_daemon.py
    user: root
    after: "network.target mosquitto.service"
    requires:
      - lexacube
    # Reuses lexacube's venv and only talks to lexacube over MQTT, so it has
    # nothing to do while a different game is active. bound_to makes it start
    # and stop with lexacube rather than at boot.
    bound_to: lexacube

  - name: knockstrip
    repo: "https://github.com/stephen5ng/knockstrip"
    path: /home/dietpi/knockstrip
    exclusive_group: game
    # The knockstrip repo owns its unit file: it carries ExecStartPre steps (the
    # grant outbox directory, the compiled song build), the pursuit Environment
    # settings and Restart=always, and game/tests/test_deployment.py enforces
    # that it stays byte-identical to the preflight sibling on every execution
    # directive. Generating a unit from exec/environment keys here would be a
    # lossy copy that silently drifts, so bootstrap installs the repo's instead.
    unit_source: ops/knockstrip.service
    extra_units:
      - ops/knockstrip-preflight.service
    apt_packages:
      - libportaudio2
